name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality checks, tests, and security audit. Security was folded into this job
  # so the workspace's `npm ci` is reused instead of installing a second time in
  # a dedicated job (audit O-07).
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    # Hard cap so a hung test can never wedge the runner indefinitely (audit Q-01).
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        # Test on both supported LTS lines; engines requires >=20.19 (audit O-08).
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint code
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Validate AI eval fixtures
        run: npm run evals:validate && npm run evals:matrix:check

      - name: Run security audit
        run: npm audit --audit-level=high

      - name: Check for vulnerabilities
        run: npx audit-ci --config audit-ci.json

      - name: Upload coverage to Codecov
        # Only publish coverage from a single matrix leg to avoid duplicate uploads.
        if: ${{ matrix.node-version == '20.x' && env.CODECOV_TOKEN != '' && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build application (separate runner, so it installs once for the build step).
  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Smoke-test packed CLI installation
        run: npm run cli:install-smoke

      - name: Smoke-test GitHub Action wrapper
        run: npm run action:smoke

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/
          retention-days: 7

  # Release workflows publish a multi-architecture image. CI performs the
  # cheaper single-platform smoke on protected main pushes, not on every PR.
  container:
    name: Build CLI Container
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build CLI container
        run: docker build --tag open-ocr-cli:ci .

      - name: Verify non-root work directory is writable
        run: docker run --rm --entrypoint sh open-ocr-cli:ci -c 'test -w /work'
